<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Inscrivez-vous à KermHosting - Hébergement Node.js en FCFA">
    <meta property="og:image" content="https://files.catbox.moe/d66qx0.jpeg">

    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="16x16" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="32x32" href="https://files.catbox.moe/d66qx0.jpeg">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237C3AED'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>K</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- hCaptcha -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    
    <title>Inscription - KermHosting</title>
    
    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #9D6CFF;
            --primary-dark: #5B2AB0;
            --primary-glow: rgba(124, 58, 237, 0.3);
            --secondary: #10B981;
            --secondary-light: #34D399;
            --accent: #F59E0B;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            
            --bg-dark: #0B1120;
            --bg-card: #1A2332;
            --bg-sidebar: #111827;
            --bg-hover: #1F2937;
            --bg-input: #1E293B;
            
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            
            --border-color: #2D3748;
            --border-light: #374151;
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-glow: 0 0 15px var(--primary-glow);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 30% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(245, 158, 11, 0.15) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 40px 32px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 24px;
            padding: 0 20px 20px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        .auth-logo i {
            color: var(--primary);
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: var(--primary);
            font-size: 1rem;
            width: 20px;
        }

        .form-input {
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }

        .form-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: var(--border-color);
            border-radius: var(--radius-full);
            overflow: hidden;
            position: relative;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-text {
            font-size: 0.8rem;
            margin-top: 4px;
            text-align: right;
        }

        .h-captcha {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .auth-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: var(--radius-full);
            padding: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .auth-btn:hover::before {
            left: 100%;
        }

        .auth-btn i {
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        .auth-btn:hover i {
            transform: translateX(5px);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-links {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }

        .auth-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s;
        }

        .auth-links a:hover {
            color: var(--primary-light);
        }

        .auth-links a:hover::after {
            width: 100%;
        }

        .message {
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message i {
            font-size: 1.2rem;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .message.info {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-group label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .checkbox-group a {
            color: var(--primary);
            text-decoration: none;
        }

        .promo-badge {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(124, 58, 237, 0.1));
            border: 1px solid var(--accent);
            border-radius: var(--radius-full);
            padding: 12px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--accent);
            font-size: 0.95rem;
        }

        .promo-badge i {
            font-size: 1.2rem;
        }

        .captcha-badge-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .captcha-verified-badge {
            background: linear-gradient(135deg, var(--success), var(--secondary));
            color: white;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-md);
            animation: slideInRight 0.5s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .captcha-waiting-badge {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }
            .auth-logo {
                font-size: 1.75rem;
            }
            .auth-title {
                font-size: 1.75rem;
            }
            .auth-btn {
                padding: 14px;
            }
            .captcha-badge-status {
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>KermHosting</span>
                </div>
                <h1 class="auth-title">Rejoignez l'aventure</h1>
                <p class="auth-subtitle">Créez votre compte et obtenez 10 coins gratuits</p>
            </div>

            <div class="promo-badge">
                <i class="fas fa-gift"></i>
                <span>🎁 10 coins offerts + 5 coins après vérification email</span>
            </div>

            <div id="messageContainer"></div>

            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user"></i>
                        Nom d'utilisateur
                    </label>
                    <input type="text" class="form-input" id="username" 
                           placeholder="johndoe" required 
                           minlength="3" maxlength="20"
                           pattern="[a-zA-Z0-9_]+"
                           title="Lettres, chiffres et underscore uniquement">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-envelope"></i>
                        Adresse email
                    </label>
                    <input type="email" class="form-input" id="email" 
                           placeholder="exemple@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"></i>
                        Mot de passe
                    </label>
                    <div style="position: relative;">
                        <input type="password" class="form-input" id="password" 
                               placeholder="••••••••" required 
                               minlength="6">
                        <button type="button" class="password-toggle" 
                                style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); cursor: pointer;"
                                onclick="togglePassword()">
                            <i class="far fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Minimum 6 caractères</div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-gift"></i>
                        Code de parrainage (optionnel)
                    </label>
                    <input type="text" class="form-input" id="referral" 
                           placeholder="KERMXXXXXX">
                </div>

                <!-- hCaptcha Widget -->
                <div class="form-group">
                    <div class="h-captcha" data-sitekey="10000000-ffff-ffff-ffff-000000000001" data-callback="onCaptchaSuccess"></div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        J'accepte les <a href="#">conditions d'utilisation</a> 
                        et la <a href="#">politique de confidentialité</a>
                    </label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="newsletter" checked>
                    <label for="newsletter">
                        Recevoir les offres promotionnelles par email
                    </label>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn" disabled>
                    <span>Vérification en cours...</span>
                    <i class="fas fa-spinner fa-pulse"></i>
                </button>
            </form>

            <div class="auth-links">
                <p>Déjà un compte ?</p>
                <a href="/login" style="font-size: 1.1rem;">
                    Se connecter
                </a>
            </div>
        </div>
    </div>

    <div class="captcha-badge-status" id="captchaBadge">
        <div class="captcha-waiting-badge">
            <i class="fas fa-shield-alt"></i>
            <span>Vérification en attente...</span>
        </div>
    </div>

    <script>
        // Vérification si déjà connecté
        async function checkAlreadyLoggedIn() {
            const token = localStorage.getItem('token');
            if (!token) return false;
            
            try {
                const response = await fetch('/api/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.user) {
                        window.location.href = '/dashboard';
                        return true;
                    }
                }
            } catch (error) {
                localStorage.removeItem('token');
            }
            return false;
        }

        let captchaVerified = false;
        let captchaToken = null;

        // Callback hCaptcha
        window.onCaptchaSuccess = function(token) {
            captchaVerified = true;
            captchaToken = token;
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Créer mon compte</span><i class="fas fa-arrow-right"></i>';
            
            const badge = document.getElementById('captchaBadge');
            badge.innerHTML = `
                <div class="captcha-verified-badge">
                    <i class="fas fa-check-circle"></i>
                    <span>✓ Site vérifié</span>
                </div>
            `;
        };

        function togglePassword() {
            const password = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            let color = '#EF4444';
            let message = 'Faible';
            
            if (password.length >= 6) strength += 1;
            if (password.length >= 8) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            
            switch(strength) {
                case 0: case 1: strength = 20; color = '#EF4444'; message = 'Très faible'; break;
                case 2: strength = 40; color = '#F59E0B'; message = 'Faible'; break;
                case 3: strength = 60; color = '#3B82F6'; message = 'Moyen'; break;
                case 4: strength = 80; color = '#10B981'; message = 'Fort'; break;
                case 5: strength = 100; color = '#10B981'; message = 'Très fort'; break;
            }
            
            strengthBar.style.width = strength + '%';
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = message;
            strengthText.style.color = color;
        });

        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref');
        if (ref) {
            document.getElementById('referral').value = ref;
        }

        function showMessage(type, text) {
            const container = document.getElementById('messageContainer');
            const icons = { error: 'fa-exclamation-circle', success: 'fa-check-circle', info: 'fa-info-circle' };
            container.innerHTML = `
                <div class="message ${type}">
                    <i class="fas ${icons[type]}"></i>
                    <span>${text}</span>
                </div>
            `;
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const referral = document.getElementById('referral').value;
            const terms = document.getElementById('terms').checked;
            const newsletter = document.getElementById('newsletter').checked;
            const submitBtn = document.getElementById('submitBtn');
            
            if (!terms) {
                showMessage('error', 'Vous devez accepter les conditions d\'utilisation');
                return;
            }
            
            if (!captchaVerified) {
                showMessage('error', 'Veuillez compléter la vérification');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Création du compte</span><span class="loader"></span>';
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username, email, password, 
                        referral_code: referral, newsletter,
                        'h-captcha-response': captchaToken
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('success', 'Compte créé ! Redirection...');
                    setTimeout(() => {
                        window.location.href = `/email-verification?email=${encodeURIComponent(email)}`;
                    }, 2000);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Créer mon compte</span><i class="fas fa-arrow-right"></i>';
                    showMessage('error', data.error || 'Erreur lors de l\'inscription');
                    
                    if(window.hcaptcha) window.hcaptcha.reset();
                    captchaVerified = false;
                    captchaToken = null;
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('submitBtn').innerHTML = '<span>Vérification en cours...</span><i class="fas fa-spinner fa-pulse"></i>';
                    
                    document.getElementById('captchaBadge').innerHTML = `
                        <div class="captcha-waiting-badge">
                            <i class="fas fa-shield-alt"></i>
                            <span>Vérification en attente...</span>
                        </div>
                    `;
                }
            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Créer mon compte</span><i class="fas fa-arrow-right"></i>';
                showMessage('error', 'Erreur de connexion au serveur');
            }
        });

        document.querySelector('.auth-card').style.opacity = '0';
        window.addEventListener('load', async () => {
            await checkAlreadyLoggedIn();
            document.querySelector('.auth-card').style.transition = 'opacity 0.5s';
            document.querySelector('.auth-card').style.opacity = '1';
        });
    </script>
</body>
</html>
