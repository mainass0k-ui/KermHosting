<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Paiement annulé - KermHosting">
    <meta property="og:image" content="https://files.catbox.moe/d66qx0.jpeg">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237C3AED'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>K</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <title>Paiement annulé - KermHosting</title>
    
    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #9D6CFF;
            --primary-dark: #5B2AB0;
            --primary-glow: rgba(124, 58, 237, 0.3);
            --secondary: #10B981;
            --secondary-light: #34D399;
            --danger: #EF4444;
            --warning: #F59E0B;
            
            --bg-dark: #0B1120;
            --bg-card: #1A2332;
            --bg-sidebar: #111827;
            --bg-hover: #1F2937;
            
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            
            --border-color: #2D3748;
            
            --shadow-glow: 0 0 15px var(--primary-glow);
            
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(239, 68, 68, 0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .cancel-container {
            width: 100%;
            max-width: 500px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cancel-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 48px 32px;
            border: 1px solid var(--border-color);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .cancel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--danger), var(--warning));
        }

        .cancel-icon {
            font-size: 5rem;
            color: var(--danger);
            margin-bottom: 24px;
        }

        .cancel-title {
            font-size: 2rem;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 16px;
            color: var(--danger);
        }

        .cancel-message {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 16px 32px;
            border-radius: var(--radius-full);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            margin: 0 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            background: var(--bg-hover);
        }

        .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .floating-shape {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--danger);
            filter: blur(100px);
            opacity: 0.1;
            z-index: -1;
        }

        .shape-1 {
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            bottom: -100px;
            right: -100px;
            background: var(--warning);
        }

        .help-text {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .help-text a {
            color: var(--primary);
            text-decoration: none;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .cancel-card {
                padding: 32px 20px;
            }

            .cancel-title {
                font-size: 1.75rem;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Formes décoratives -->
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>

    <div class="cancel-container">
        <div class="cancel-card">
            <div class="cancel-icon">
                <i class="fas fa-times-circle"></i>
            </div>
            
            <h1 class="cancel-title">Paiement annulé</h1>
            
            <p class="cancel-message" id="cancelMessage">
                Votre paiement a été annulé.<br>
                Aucun montant n'a été débité.
            </p>

            <div class="actions">
                <a href="/pricing" class="btn">
                    <i class="fas fa-shopping-cart"></i>
                    Réessayer
                </a>
                <a href="/buy-coins" class="btn btn-outline">
                    <i class="fas fa-coins"></i>
                    Acheter des coins
                </a>
            </div>

            <div class="help-text">
                <p>Besoin d'aide ? <a href="/support">Contactez le support</a></p>
                <p style="margin-top: 8px;">
                    <a href="/dashboard">Retour au tableau de bord</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Récupérer le type depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        
        if (type === 'insufficient') {
            document.getElementById('cancelMessage').innerHTML = `
                Solde de coins insuffisant.<br>
                Veuillez recharger votre compte ou choisir un autre mode de paiement.
            `;
        } else if (type === 'timeout') {
            document.getElementById('cancelMessage').innerHTML = `
                Le délai de paiement a expiré.<br>
                Veuillez réessayer.
            `;
        }
        
        // Redirection automatique après 10 secondes
        setTimeout(() => {
            window.location.href = '/pricing';
        }, 10000);
    </script>
</body>
</html>
