<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Connectez-vous à KermHosting - Hébergement Node.js en FCFA">
    <meta property="og:image" content="https://files.catbox.moe/d66qx0.jpeg">

    <!-- Favicon / Icônes -->
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="16x16" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="32x32" href="https://files.catbox.moe/d66qx0.jpeg">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237C3AED'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>K</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <title>Connexion - KermHosting</title>
    
    <style>
        /* ===== VARIABLES ===== */
        :root {
            --primary: #7C3AED;
            --primary-light: #9D6CFF;
            --primary-dark: #5B2AB0;
            --primary-glow: rgba(124, 58, 237, 0.3);
            --secondary: #10B981;
            --secondary-light: #34D399;
            --accent: #F59E0B;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            
            --bg-dark: #0B1120;
            --bg-card: #1A2332;
            --bg-sidebar: #111827;
            --bg-hover: #1F2937;
            --bg-input: #1E293B;
            
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            
            --border-color: #2D3748;
            --border-light: #374151;
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-glow: 0 0 15px var(--primary-glow);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.15) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== CARTE DE CONNEXION ===== */
        .auth-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 40px 32px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        /* ===== EN-TÊTE ===== */
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 24px;
            padding: 0 20px 20px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        .auth-logo i {
            color: var(--primary);
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* ===== FORMULAIRE ===== */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: var(--primary);
            font-size: 1rem;
            width: 20px;
        }

        .form-input {
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }

        .form-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* ===== BOUTONS ===== */
        .auth-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: var(--radius-full);
            padding: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .auth-btn:hover::before {
            left: 100%;
        }

        .auth-btn i {
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        .auth-btn:hover i {
            transform: translateX(5px);
        }

        .auth-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== LIENS ===== */
        .auth-links {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }

        .auth-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s;
        }

        .auth-links a:hover {
            color: var(--primary-light);
        }

        .auth-links a:hover::after {
            width: 100%;
        }

        .auth-links p {
            margin: 12px 0;
        }

        /* ===== MESSAGES D'ERREUR/SUCCÈS ===== */
        .message {
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message i {
            font-size: 1.2rem;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .message.info {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .message.warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        /* ===== LOADER ===== */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== BOUTON FORCE LOGOUT ===== */
        .force-logout {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px 16px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .force-logout:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }

            .auth-logo {
                font-size: 1.75rem;
            }

            .auth-title {
                font-size: 1.75rem;
            }

            .auth-btn {
                padding: 14px;
            }
        }

        /* ===== DÉCORATIONS ===== */
        .floating-shape {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--primary);
            filter: blur(100px);
            opacity: 0.1;
            z-index: -1;
        }

        .shape-1 {
            top: -100px;
            left: -100px;
            background: var(--primary);
        }

        .shape-2 {
            bottom: -100px;
            right: -100px;
            background: var(--secondary);
        }
    </style>
</head>
<body>
    <!-- Formes décoratives -->
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>

    <!-- Bouton de déconnexion forcée -->
    <div class="force-logout" id="forceLogoutBtn" style="display: none;" onclick="forceLogout()">
        <i class="fas fa-power-off"></i>
        <span>Déconnexion forcée</span>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- En-tête -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>KermHosting</span>
                </div>
                <h1 class="auth-title">Content de vous revoir !</h1>
                <p class="auth-subtitle">Connectez-vous pour gérer vos serveurs</p>
            </div>

            <!-- Message d'erreur/succès -->
            <div id="messageContainer"></div>

            <!-- Formulaire -->
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-envelope"></i>
                        Adresse email
                    </label>
                    <input type="email" class="form-input" id="email" 
                           placeholder="exemple@email.com" required 
                           autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"></i>
                        Mot de passe
                    </label>
                    <div style="position: relative;">
                        <input type="password" class="form-input" id="password" 
                               placeholder="••••••••" required 
                               autocomplete="current-password">
                        <button type="button" class="password-toggle" 
                                style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); cursor: pointer;"
                                onclick="togglePassword()">
                            <i class="far fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div style="text-align: right;">
                    <a href="/forgot-password" style="color: var(--primary); font-size: 0.9rem; text-decoration: none;">
                        Mot de passe oublié ?
                    </a>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">
                    <span>Se connecter</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- Liens -->
            <div class="auth-links">
                <p>Pas encore de compte ?</p>
                <a href="/register" style="font-size: 1.1rem;">
                    Créer un compte gratuitement
                </a>
                <p style="margin-top: 20px; font-size: 0.85rem;">
                    En vous connectant, vous acceptez nos 
                    <a href="#">conditions d'utilisation</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // INTERCEPTEUR MAINTENANCE - VERSION CORRIGÉE
        // ============================================
        (function() {
            // Sauvegarde du fetch original
            const originalFetch = window.fetch;
            
            // Nouveau fetch avec interception
            window.fetch = async function(...args) {
                try {
                    // Timeout pour éviter les requêtes bloquées
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 secondes max
                    
                    // Ajouter le signal aux options
                    let options = args[1] || {};
                    options.signal = controller.signal;
                    args[1] = options;
                    
                    const response = await originalFetch(...args);
                    clearTimeout(timeoutId);
                    
                    // CAS 1: Status 503 (Service Unavailable)
                    if (response.status === 503) {
                        console.log('🚧 [MAINTENANCE] Status 503 détecté');
                        handleMaintenance('Maintenance en cours (503)');
                        throw new Error('MAINTENANCE_MODE');
                    }
                    
                    // CAS 2: Vérifier si le body JSON contient un flag maintenance
                    const clonedResponse = response.clone();
                    const contentType = response.headers.get('content-type');
                    
                    if (contentType && contentType.includes('application/json')) {
                        try {
                            const data = await clonedResponse.json();
                            
                            if (data && (data.maintenance === true || data.error === 'MAINTENANCE_MODE')) {
                                console.log('🚧 [MAINTENANCE] Flag détecté dans JSON');
                                handleMaintenance(data.message || 'Mode maintenance actif');
                                throw new Error('MAINTENANCE_MODE');
                            }
                        } catch (e) {
                            // Ignorer les erreurs de parsing
                        }
                    }
                    
                    return response;
                    
                } catch (error) {
                    // Gérer le timeout
                    if (error.name === 'AbortError') {
                        console.log('⏱️ Timeout - Le serveur ne répond pas');
                        // Vérifier si c'est peut-être la maintenance
                        checkMaintenanceStatus();
                        throw new Error('REQUEST_TIMEOUT');
                    }
                    
                    // Si c'est notre erreur de maintenance, on la relance
                    if (error.message === 'MAINTENANCE_MODE') {
                        throw error;
                    }
                    
                    // Erreur réseau
                    if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
                        console.log('🌐 Problème de connexion - Vérification maintenance...');
                        checkMaintenanceStatus();
                    }
                    
                    throw error;
                }
            };
            
            // Fonction de gestion de la maintenance
            function handleMaintenance(reason = '') {
                if (sessionStorage.getItem('maintenance_redirecting')) {
                    return;
                }
                
                sessionStorage.setItem('maintenance_redirecting', 'true');
                
                // Sauvegarder l'URL actuelle si c'est le dashboard
                if (window.location.pathname.includes('/dashboard')) {
                    sessionStorage.setItem('maintenance_return_url', window.location.href);
                }
                
                // Redirection avec message
                console.log(`🚧 Redirection: ${reason}`);
                window.location.href = '/maintenance?reason=' + encodeURIComponent(reason);
            }
            
            // Vérifier si le serveur est en maintenance
            async function checkMaintenanceStatus() {
                try {
                    const response = await fetch('/api/status', {
                        method: 'HEAD', // HEAD request plus légère
                        cache: 'no-cache'
                    });
                    
                    if (response.status === 503) {
                        handleMaintenance('Maintenance détectée');
                    }
                } catch (error) {
                    console.log('Status check failed');
                }
            }
        })();
        // ===== FIN INTERCEPTEUR =====

        // ============================================
        // FONCTIONS UTILITAIRES
        // ============================================
        
        function togglePassword() {
            const password = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showMessage(type, text) {
            const container = document.getElementById('messageContainer');
            const icons = {
                error: 'fa-exclamation-circle',
                success: 'fa-check-circle',
                info: 'fa-info-circle',
                warning: 'fa-exclamation-triangle'
            };
            
            container.innerHTML = `
                <div class="message ${type}">
                    <i class="fas ${icons[type]}"></i>
                    <span>${text}</span>
                </div>
            `;
        }

        function forceLogout() {
            if (confirm('Forcer la déconnexion ?')) {
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = '/';
            }
        }

        // ============================================
        // GESTIONNAIRE DE CONNEXION CORRIGÉ
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            
            if (!email || !password) {
                showMessage('error', 'Veuillez remplir tous les champs');
                return;
            }
            
            // Désactiver le bouton
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Connexion...</span><span class="loader"></span>';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                // Si on arrive ici, c'est que la requête a répondu
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    showMessage('success', 'Connexion réussie !');
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Se connecter</span><i class="fas fa-arrow-right"></i>';
                    showMessage('error', data.error || 'Email ou mot de passe incorrect');
                }
                
            } catch (error) {
                // Réactiver le bouton
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Se connecter</span><i class="fas fa-arrow-right"></i>';
                
                if (error.message === 'MAINTENANCE_MODE') {
                    // Déjà redirigé par l'intercepteur
                    console.log('Redirection maintenance en cours...');
                } else if (error.message === 'REQUEST_TIMEOUT') {
                    showMessage('warning', 'Le serveur ne répond pas - Vérification maintenance...');
                    // Vérifier si c'est la maintenance
                    setTimeout(() => {
                        window.location.reload();
                    }, 2000);
                } else {
                    showMessage('error', 'Erreur de connexion au serveur');
                    document.getElementById('forceLogoutBtn').style.display = 'flex';
                }
            }
        });

        // Vérifier au chargement
        window.addEventListener('load', () => {
            // Animation
            document.querySelector('.auth-card').style.opacity = '0';
            setTimeout(() => {
                document.querySelector('.auth-card').style.transition = 'opacity 0.5s';
                document.querySelector('.auth-card').style.opacity = '1';
            }, 100);
            
            // Vérifier si on revient de maintenance
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('maintenance') === 'ended') {
                showMessage('success', 'La maintenance est terminée ! Vous pouvez vous connecter.');
            }
        });

        // Exposer les fonctions
        window.togglePassword = togglePassword;
        window.forceLogout = forceLogout;
    </script>
</body>
</html>
