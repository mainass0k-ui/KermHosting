<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Connectez-vous à KermHosting - Hébergement Node.js en FCFA">
    <meta property="og:image" content="https://files.catbox.moe/d66qx0.jpeg">

    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="16x16" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="32x32" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237C3AED'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>K</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    <title>Connexion - KermHosting</title>
    
    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #9D6CFF;
            --primary-dark: #5B2AB0;
            --primary-glow: rgba(124, 58, 237, 0.3);
            --secondary: #10B981;
            --secondary-light: #34D399;
            --accent: #F59E0B;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            
            --bg-dark: #0B1120;
            --bg-card: rgba(26, 35, 50, 0.85);
            --bg-sidebar: #111827;
            --bg-hover: #1F2937;
            --bg-input: rgba(30, 41, 59, 0.7);
            
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            
            --border-color: rgba(45, 55, 72, 0.6);
            --border-light: #374151;
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-glow: 0 0 25px var(--primary-glow);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Fond animé avec particules */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -2;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-30px) translateX(15px); }
            50% { transform: translateY(-50px) translateX(-15px); }
            75% { transform: translateY(-20px) translateX(25px); }
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 40px 32px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-lg), 0 0 40px rgba(124, 58, 237, 0.1);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent), var(--primary));
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 24px;
            padding: 0 20px 20px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        .auth-logo i {
            color: var(--primary);
            font-size: 2.5rem;
            filter: drop-shadow(0 0 15px var(--primary-glow));
            animation: logoGlow 2s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% { filter: drop-shadow(0 0 10px var(--primary-glow)); }
            100% { filter: drop-shadow(0 0 25px var(--primary-glow)); }
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: var(--primary);
            font-size: 1rem;
            width: 20px;
        }

        .form-input {
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
            backdrop-filter: blur(5px);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }

        .form-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .cf-turnstile {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-group label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* OAuth Buttons */
        .oauth-section {
            margin: 24px 0 16px;
            text-align: center;
        }

        .oauth-divider {
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .oauth-divider::before,
        .oauth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
        }

        .oauth-divider span {
            padding: 0 16px;
        }

        .oauth-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            min-width: 110px;
        }

        .oauth-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow);
        }

        .oauth-btn.google {
            border-color: #DB4437;
        }
        .oauth-btn.google:hover {
            background: rgba(219, 68, 55, 0.15);
            border-color: #DB4437;
        }
        .oauth-btn.google i {
            color: #DB4437;
        }

        .oauth-btn.discord {
            border-color: #5865F2;
        }
        .oauth-btn.discord:hover {
            background: rgba(88, 101, 242, 0.15);
            border-color: #5865F2;
        }
        .oauth-btn.discord i {
            color: #5865F2;
        }

        .oauth-btn.github {
            border-color: #6e5494;
        }
        .oauth-btn.github:hover {
            background: rgba(110, 84, 148, 0.15);
            border-color: #6e5494;
        }
        .oauth-btn.github i {
            color: #6e5494;
        }

        .auth-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: var(--radius-full);
            padding: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .auth-btn:hover::before {
            left: 100%;
        }

        .auth-btn i {
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        .auth-btn:hover i {
            transform: translateX(5px);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-links {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }

        .auth-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s;
        }

        .auth-links a:hover {
            color: var(--primary-light);
        }

        .auth-links a:hover::after {
            width: 100%;
        }

        .auth-links p {
            margin: 12px 0;
        }

        .message {
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
            backdrop-filter: blur(10px);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .message i {
            font-size: 1.2rem;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .message.info {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .forgot-password {
            text-align: right;
            margin-top: 4px;
        }

        .forgot-password a {
            color: var(--primary);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password a:hover {
            color: var(--primary-light);
        }

        .captcha-badge-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .captcha-verified-badge {
            background: linear-gradient(135deg, var(--success), var(--secondary));
            color: white;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-md);
            animation: slideInRight 0.5s ease-out;
            backdrop-filter: blur(10px);
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .captcha-waiting-badge {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(10px);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }
            .auth-logo {
                font-size: 1.75rem;
            }
            .auth-title {
                font-size: 1.75rem;
            }
            .auth-btn {
                padding: 14px;
            }
            .oauth-buttons {
                gap: 10px;
            }
            .oauth-btn {
                padding: 10px 16px;
                min-width: 95px;
            }
            .captcha-badge-status {
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Particules flottantes -->
    <div class="particles" id="particles"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>KermHosting</span>
                </div>
                <h1 class="auth-title">Content de vous revoir !</h1>
                <p class="auth-subtitle">Connectez-vous pour gérer vos serveurs</p>
            </div>

            <div id="messageContainer"></div>

            <!-- OAuth Section -->
            <div class="oauth-section">
                <div class="oauth-divider">
                    <span>Connexion rapide</span>
                </div>
                <div class="oauth-buttons">
                    <a href="/api/oauth/google" class="oauth-btn google">
                        <i class="fab fa-google"></i>
                        Google
                    </a>
                    <a href="/api/oauth/discord" class="oauth-btn discord">
                        <i class="fab fa-discord"></i>
                        Discord
                    </a>
                    <a href="/api/oauth/github" class="oauth-btn github">
                        <i class="fab fa-github"></i>
                        GitHub
                    </a>
                </div>
                <div class="oauth-divider" style="margin-top: 20px;">
                    <span>ou avec email</span>
                </div>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user"></i>
                        Email ou Nom d'utilisateur
                    </label>
                    <input type="text" class="form-input" id="loginIdentifier" 
                           placeholder="exemple@email.com ou johndoe" required 
                           autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"></i>
                        Mot de passe
                    </label>
                    <div style="position: relative;">
                        <input type="password" class="form-input" id="password" 
                               placeholder="••••••••" required 
                               autocomplete="current-password">
                        <button type="button" class="password-toggle" 
                                style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); cursor: pointer;"
                                onclick="togglePassword()">
                            <i class="far fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Cloudflare Turnstile -->
                <div class="form-group">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAC0PPHCORga2nzPW" data-callback="onTurnstileSuccess"></div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">
                        Se souvenir de moi
                    </label>
                </div>

                <div class="forgot-password">
                    <a href="/forgot-password">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn" disabled>
                    <span>Vérification en cours...</span>
                    <i class="fas fa-spinner fa-pulse"></i>
                </button>
            </form>

            <div class="auth-links">
                <p>Pas encore de compte ?</p>
                <a href="/register" style="font-size: 1.1rem;">
                    Créer un compte gratuitement
                </a>
                <p style="margin-top: 20px; font-size: 0.85rem;">
                    En vous connectant, vous acceptez nos 
                    <a href="#">conditions d'utilisation</a>
                </p>
            </div>
        </div>
    </div>

    <div class="captcha-badge-status" id="captchaBadge">
        <div class="captcha-waiting-badge">
            <i class="fas fa-shield-alt"></i>
            <span>Vérification en attente...</span>
        </div>
    </div>

    <script>
        // ===== DÉTECTION MAINTENANCE =====
        async function checkMaintenance() {
            try {
                const response = await fetch('/api/maintenance/status');
                const data = await response.json();
                
                if (data.maintenance === true) {
                    window.location.href = '/maintenance';
                    return true;
                }
                return false;
            } catch (error) {
                console.error('Erreur vérification maintenance:', error);
                return false;
            }
        }

        // ===== GÉNÉRATION PARTICULES =====
        function generateParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 20) + 's';
                particle.style.width = (2 + Math.random() * 6) + 'px';
                particle.style.height = particle.style.width;
                particle.style.opacity = 0.1 + Math.random() * 0.3;
                container.appendChild(particle);
            }
        }

        let turnstileVerified = false;
        let turnstileToken = null;

        window.onTurnstileSuccess = function(token) {
            turnstileVerified = true;
            turnstileToken = token;
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Se connecter</span><i class="fas fa-arrow-right"></i>';
            
            const badge = document.getElementById('captchaBadge');
            badge.innerHTML = `
                <div class="captcha-verified-badge">
                    <i class="fas fa-check-circle"></i>
                    <span>✓ Site vérifié</span>
                </div>
            `;
        };

        async function checkAlreadyLoggedIn() {
            const token = localStorage.getItem('token');
            if (!token) return false;
            
            try {
                const response = await fetch('/api/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.user) {
                        window.location.href = '/dashboard';
                        return true;
                    }
                }
            } catch (error) {
                localStorage.removeItem('token');
            }
            return false;
        }

        function togglePassword() {
            const password = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showMessage(type, text) {
            const container = document.getElementById('messageContainer');
            const icons = {
                error: 'fa-exclamation-circle',
                success: 'fa-check-circle',
                info: 'fa-info-circle'
            };
            
            container.innerHTML = `
                <div class="message ${type}">
                    <i class="fas ${icons[type]}"></i>
                    <span>${text}</span>
                </div>
            `;
        }

        function loadSavedCredentials() {
            const savedIdentifier = localStorage.getItem('savedIdentifier');
            const savedPassword = localStorage.getItem('savedPassword');
            const rememberMe = localStorage.getItem('rememberMe') === 'true';
            
            if (rememberMe && savedIdentifier) {
                document.getElementById('loginIdentifier').value = savedIdentifier;
                if (savedPassword) {
                    document.getElementById('password').value = savedPassword;
                }
                document.getElementById('rememberMe').checked = true;
            }
        }

        function saveCredentials(identifier, password, remember) {
            if (remember) {
                localStorage.setItem('savedIdentifier', identifier);
                localStorage.setItem('savedPassword', password);
                localStorage.setItem('rememberMe', 'true');
            } else {
                localStorage.removeItem('savedIdentifier');
                localStorage.removeItem('savedPassword');
                localStorage.setItem('rememberMe', 'false');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const submitBtn = document.getElementById('submitBtn');
            
            if (!identifier) {
                showMessage('error', 'Veuillez entrer votre email ou nom d\'utilisateur');
                return;
            }
            
            if (!turnstileVerified) {
                showMessage('error', 'Veuillez compléter la vérification');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Connexion en cours</span><span class="loader"></span>';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        identifier: identifier,
                        password: password,
                        'cf-turnstile-response': turnstileToken
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    saveCredentials(identifier, password, rememberMe);
                    localStorage.setItem('token', data.token);
                    
                    showMessage('success', 'Connexion réussie ! Redirection...');
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Se connecter</span><i class="fas fa-arrow-right"></i>';
                    
                    if (data.requiresVerification) {
                        showMessage('info', 'Email non vérifié. Redirection...');
                        setTimeout(() => {
                            window.location.href = `/email-verification?email=${encodeURIComponent(identifier)}`;
                        }, 2000);
                    } else {
                        showMessage('error', data.error || 'Identifiant ou mot de passe incorrect');
                        
                        turnstileVerified = false;
                        turnstileToken = null;
                        document.getElementById('submitBtn').disabled = true;
                        document.getElementById('submitBtn').innerHTML = '<span>Vérification en cours...</span><i class="fas fa-spinner fa-pulse"></i>';
                        
                        document.getElementById('captchaBadge').innerHTML = `
                            <div class="captcha-waiting-badge">
                                <i class="fas fa-shield-alt"></i>
                                <span>Vérification en attente...</span>
                            </div>
                        `;
                        
                        if(window.turnstile) {
                            turnstile.reset();
                        }
                    }
                }
            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Se connecter</span><i class="fas fa-arrow-right"></i>';
                showMessage('error', 'Erreur de connexion au serveur');
            }
        });

        // ===== INITIALISATION =====
        window.addEventListener('load', async () => {
            // Vérifier la maintenance d'abord
            const isMaintenance = await checkMaintenance();
            if (isMaintenance) return;
            
            // Vérifier si déjà connecté
            const isLoggedIn = await checkAlreadyLoggedIn();
            if (!isLoggedIn) {
                loadSavedCredentials();
            }
            
            // Animation de la carte
            document.querySelector('.auth-card').style.transition = 'opacity 0.5s';
            document.querySelector('.auth-card').style.opacity = '1';
            
            // Générer les particules
            generateParticles();
        });
    </script>
</body>
</html>
