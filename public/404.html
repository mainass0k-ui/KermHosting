<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Page non trouvée - KermHosting">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237C3AED'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>K</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <title>Page non trouvée - KermHosting</title>
    
    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #9D6CFF;
            --primary-dark: #5B2AB0;
            --primary-glow: rgba(124, 58, 237, 0.3);
            --secondary: #10B981;
            --secondary-light: #34D399;
            --accent: #F59E0B;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            
            --bg-dark: #0B1120;
            --bg-card: #1A2332;
            --bg-sidebar: #111827;
            
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            
            --border-color: #2D3748;
            
            --shadow-glow: 0 0 15px var(--primary-glow);
            
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-size: 12rem;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 0 30px var(--primary-glow);
            position: relative;
        }

        .error-code::before {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: blur(20px);
            opacity: 0.3;
            z-index: -1;
        }

        .title {
            font-size: 2.5rem;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 16px;
        }

        .message {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            border-radius: var(--radius-full);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            background: var(--bg-hover);
        }

        .search-box {
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }

        .search-btn {
            padding: 14px 24px;
            background: var(--primary);
            border: none;
            border-radius: var(--radius-full);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .links {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid var(--border-color);
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .link-item {
            text-align: center;
        }

        .link-item a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .link-item a:hover {
            color: var(--primary);
        }

        .link-item i {
            display: block;
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .floating-shape {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--primary);
            filter: blur(100px);
            opacity: 0.1;
            z-index: 0;
        }

        .shape-1 {
            top: -100px;
            left: -100px;
            background: var(--primary);
        }

        .shape-2 {
            bottom: -100px;
            right: -100px;
            background: var(--secondary);
        }

        .shape-3 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: var(--accent);
            opacity: 0.05;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 8rem;
            }

            .title {
                font-size: 2rem;
            }

            .message {
                font-size: 1rem;
            }

            .actions {
                flex-direction: column;
            }

            .search-box {
                flex-direction: column;
            }

            .links-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Formes décoratives -->
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>

    <div class="container">
        <div class="error-code">404</div>
        
        <h1 class="title">Page non trouvée</h1>
        
        <p class="message">
            Oups ! La page que vous recherchez n'existe pas ou a été déplacée.<br>
            Vous pouvez retourner à l'accueil ou utiliser la recherche ci-dessous.
        </p>

        <div class="actions">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i>
                Accueil
            </a>
            <a href="/dashboard" class="btn btn-outline">
                <i class="fas fa-tachometer-alt"></i>
                Tableau de bord
            </a>
        </div>

        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Rechercher sur le site...">
            <button class="search-btn" onclick="searchSite()">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div class="links">
            <p>Pages populaires :</p>
            <div class="links-grid">
                <div class="link-item">
                    <a href="/pricing">
                        <i class="fas fa-tags"></i>
                        <span>Tarifs</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="/buy-coins">
                        <i class="fas fa-coins"></i>
                        <span>Acheter des coins</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="/support">
                        <i class="fas fa-headset"></i>
                        <span>Support</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function searchSite() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            // Rediriger vers la page de support avec la recherche
            if (query) {
                window.location.href = `/support?q=${encodeURIComponent(query)}`;
            }
        }

        // Gérer la touche Entrée dans le champ de recherche
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchSite();
            }
        });

        // Redirection automatique après 10 secondes
        setTimeout(() => {
            window.location.href = '/';
        }, 10000);
    </script>
</body>
</html>
