<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Page non trouvée - KermHosting">

    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="16x16" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="32x32" href="https://files.catbox.moe/d66qx0.jpeg">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237C3AED'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>K</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <title>404 - KermHosting</title>
    
    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #9D6CFF;
            --primary-dark: #5B2AB0;
            --primary-glow: rgba(124, 58, 237, 0.3);
            --secondary: #10B981;
            --secondary-light: #34D399;
            --accent: #F59E0B;
            
            --bg-dark: #0B1120;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== OUTILS ANIMÉS EN BACKGROUND ===== */
        .tools-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 0;
            overflow: hidden;
        }

        .floating-tool {
            position: absolute;
            font-size: 2rem;
            opacity: 0.06;
            color: var(--primary-light);
            animation: toolFloat 15s ease-in-out infinite;
        }

        .floating-tool:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; font-size: 2.5rem; }
        .floating-tool:nth-child(2) { top: 20%; right: 8%; animation-delay: -2s; font-size: 3rem; }
        .floating-tool:nth-child(3) { top: 60%; left: 10%; animation-delay: -4s; font-size: 2rem; }
        .floating-tool:nth-child(4) { top: 75%; right: 5%; animation-delay: -6s; font-size: 2.8rem; }
        .floating-tool:nth-child(5) { top: 35%; left: 50%; animation-delay: -8s; font-size: 2.2rem; }
        .floating-tool:nth-child(6) { top: 5%; right: 30%; animation-delay: -10s; font-size: 3.2rem; }
        .floating-tool:nth-child(7) { top: 85%; left: 40%; animation-delay: -12s; font-size: 2.4rem; }
        .floating-tool:nth-child(8) { top: 45%; right: 20%; animation-delay: -14s; font-size: 2.6rem; }
        .floating-tool:nth-child(9) { top: 15%; left: 70%; animation-delay: -3s; font-size: 1.8rem; }
        .floating-tool:nth-child(10) { top: 90%; right: 50%; animation-delay: -5s; font-size: 2rem; }
        .floating-tool:nth-child(11) { top: 50%; left: 25%; animation-delay: -7s; font-size: 3rem; }
        .floating-tool:nth-child(12) { top: 30%; right: 60%; animation-delay: -9s; font-size: 2.2rem; }
        .floating-tool:nth-child(13) { top: 70%; left: 80%; animation-delay: -11s; font-size: 2.5rem; }
        .floating-tool:nth-child(14) { top: 55%; right: 40%; animation-delay: -13s; font-size: 2.8rem; }
        .floating-tool:nth-child(15) { top: 25%; left: 35%; animation-delay: -1s; font-size: 2rem; }

        @keyframes toolFloat {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.04;
            }
            25% {
                transform: translateY(-40px) translateX(30px) rotate(10deg);
                opacity: 0.08;
            }
            50% {
                transform: translateY(-20px) translateX(-20px) rotate(-5deg);
                opacity: 0.05;
            }
            75% {
                transform: translateY(-50px) translateX(-30px) rotate(15deg);
                opacity: 0.07;
            }
        }

        /* Particules */
        .particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 30%; left: 70%; animation-delay: -1s; }
        .particle:nth-child(3) { top: 55%; left: 10%; animation-delay: -2s; }
        .particle:nth-child(4) { top: 70%; left: 80%; animation-delay: -3s; }
        .particle:nth-child(5) { top: 10%; left: 50%; animation-delay: -4s; }
        .particle:nth-child(6) { top: 40%; left: 40%; animation-delay: -5s; }
        .particle:nth-child(7) { top: 60%; left: 60%; animation-delay: -2.5s; }
        .particle:nth-child(8) { top: 80%; left: 30%; animation-delay: -3.5s; }
        .particle:nth-child(9) { top: 20%; left: 90%; animation-delay: -1.5s; }
        .particle:nth-child(10) { top: 50%; left: 85%; animation-delay: -4.5s; }

        @keyframes particleFloat {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            50% {
                transform: translateY(-60px) translateX(20px) scale(2);
                opacity: 0.3;
            }
            80% {
                opacity: 0.6;
            }
        }

        /* Grille subtile */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 0;
            background-image: 
                linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridPulse 8s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ===== CONTENU PRINCIPAL ===== */
        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
            position: relative;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo-section {
            margin-bottom: 40px;
        }

        .kerm-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-primary);
        }

        .kerm-logo i {
            font-size: 2rem;
            color: var(--primary);
            filter: drop-shadow(0 0 15px var(--primary-glow));
            animation: cloudBounce 3s ease-in-out infinite;
        }

        @keyframes cloudBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Code 404 géant */
        .error-code-wrapper {
            position: relative;
            margin-bottom: 24px;
            display: inline-block;
        }

        .error-code {
            font-size: 12rem;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
            z-index: 1;
            animation: codePulse 3s ease-in-out infinite;
        }

        @keyframes codePulse {
            0%, 100% { 
                filter: brightness(1) drop-shadow(0 0 30px rgba(124, 58, 237, 0.3));
            }
            50% { 
                filter: brightness(1.2) drop-shadow(0 0 50px rgba(124, 58, 237, 0.5));
            }
        }

        .error-code-shadow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12rem;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: blur(40px);
            opacity: 0.5;
            z-index: 0;
            animation: shadowPulse 3s ease-in-out infinite;
        }

        @keyframes shadowPulse {
            0%, 100% { opacity: 0.4; filter: blur(40px); }
            50% { opacity: 0.7; filter: blur(60px); }
        }

        /* Cercle d'outils tournants autour du 404 */
        .orbit-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 280px; height: 280px;
            border-radius: 50%;
            border: 1px dashed rgba(124, 58, 237, 0.1);
            animation: orbitSpin 20s linear infinite;
            pointer-events: none;
        }

        .orbit-icon {
            position: absolute;
            font-size: 1.5rem;
            color: var(--primary-light);
            opacity: 0.6;
            animation: orbitFloat 4s ease-in-out infinite;
        }

        .orbit-icon:nth-child(1) { top: -10px; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
        .orbit-icon:nth-child(2) { top: 50%; right: -10px; transform: translateY(-50%); animation-delay: -1s; }
        .orbit-icon:nth-child(3) { bottom: -10px; left: 50%; transform: translateX(-50%); animation-delay: -2s; }
        .orbit-icon:nth-child(4) { top: 50%; left: -10px; transform: translateY(-50%); animation-delay: -3s; }

        @keyframes orbitSpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes orbitFloat {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-8px) translateX(5px); }
        }

        .orbit-icon:nth-child(1) { animation-name: orbitFloat1; }
        .orbit-icon:nth-child(2) { animation-name: orbitFloat2; }
        .orbit-icon:nth-child(3) { animation-name: orbitFloat3; }
        .orbit-icon:nth-child(4) { animation-name: orbitFloat4; }

        @keyframes orbitFloat1 { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-10px); } }
        @keyframes orbitFloat2 { 0%, 100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(8px); } }
        @keyframes orbitFloat3 { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }
        @keyframes orbitFloat4 { 0%, 100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(-8px); } }

        /* Message simple */
        .title {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 36px;
        }

        /* Boutons */
        .actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 28px;
            border-radius: var(--radius-full);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(124, 58, 237, 0.6);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            background: rgba(124, 58, 237, 0.08);
            transform: translateY(-3px);
        }

        /* Footer */
        .footer-text {
            margin-top: 28px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .error-code, .error-code-shadow {
                font-size: 8rem;
            }
            .orbit-ring {
                width: 200px; height: 200px;
            }
            .title {
                font-size: 1.3rem;
            }
            .btn {
                padding: 14px 22px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background animé d'outils -->
    <div class="tools-bg">
        <i class="fas fa-wrench floating-tool"></i>
        <i class="fas fa-screwdriver floating-tool"></i>
        <i class="fas fa-hammer floating-tool"></i>
        <i class="fas fa-tools floating-tool"></i>
        <i class="fas fa-cog floating-tool"></i>
        <i class="fas fa-pencil-ruler floating-tool"></i>
        <i class="fas fa-code floating-tool"></i>
        <i class="fas fa-terminal floating-tool"></i>
        <i class="fas fa-server floating-tool"></i>
        <i class="fas fa-database floating-tool"></i>
        <i class="fas fa-shield-alt floating-tool"></i>
        <i class="fas fa-key floating-tool"></i>
        <i class="fas fa-plug floating-tool"></i>
        <i class="fas fa-microchip floating-tool"></i>
        <i class="fas fa-bug floating-tool"></i>
    </div>

    <!-- Grille -->
    <div class="grid-bg"></div>

    <!-- Particules -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <!-- Logo KermHosting -->
        <div class="logo-section">
            <div class="kerm-logo">
                <i class="fas fa-cloud-upload-alt"></i>
                <span>KermHosting</span>
            </div>
        </div>

        <!-- Code 404 avec orbite d'outils -->
        <div class="error-code-wrapper">
            <div class="orbit-ring">
                <i class="fas fa-wrench orbit-icon"></i>
                <i class="fas fa-code orbit-icon"></i>
                <i class="fas fa-server orbit-icon"></i>
                <i class="fas fa-terminal orbit-icon"></i>
            </div>
            <div class="error-code-shadow">404</div>
            <div class="error-code">404</div>
        </div>

        <!-- Message -->
        <h1 class="title">Page non trouvée</h1>
        <p class="subtitle">La page que vous recherchez n'existe pas</p>

        <!-- Boutons -->
        <div class="actions">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i>
                Accueil
            </a>
            <a href="/dashboard" class="btn btn-outline">
                <i class="fas fa-tachometer-alt"></i>
                Dashboard
            </a>
        </div>

        <!-- Footer -->
        <p class="footer-text">KermHosting © 2026</p>
    </div>
</body>
</html>
