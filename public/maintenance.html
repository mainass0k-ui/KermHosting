<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#7C3AED">
    <title>Maintenance - KermHosting</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0B1120 0%, #1A2332 100%);
            color: #F3F4F6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 40% 20%, rgba(16, 185, 129, 0.1) 0%, transparent 30%);
            pointer-events: none;
            z-index: -1;
        }

        .maintenance-container {
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .maintenance-card {
            background: rgba(26, 35, 50, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px 32px;
            border: 1px solid rgba(45, 55, 72, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .maintenance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #7C3AED, #F59E0B, #10B981);
        }

        .maintenance-icon {
            text-align: center;
            font-size: 5rem;
            margin-bottom: 24px;
            animation: wrench 2.5s ease-in-out infinite;
        }

        @keyframes wrench {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
        }

        .maintenance-icon i {
            background: linear-gradient(135deg, #7C3AED, #F59E0B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .maintenance-title {
            font-size: 2.5rem;
            font-family: 'Space Grotesk', sans-serif;
            text-align: center;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #7C3AED, #F59E0B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .maintenance-message {
            text-align: center;
            color: #9CA3AF;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .info-item {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2D3748;
        }

        .info-item i {
            font-size: 2rem;
            color: #7C3AED;
            margin-bottom: 12px;
        }

        .info-label {
            color: #9CA3AF;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #F3F4F6;
        }

        .countdown-container {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.1), rgba(245, 158, 11, 0.1));
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid rgba(124, 58, 237, 0.3);
        }

        .countdown-title {
            text-align: center;
            color: #9CA3AF;
            margin-bottom: 16px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .countdown-item {
            text-align: center;
            min-width: 70px;
        }

        .countdown-number {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            color: #7C3AED;
            line-height: 1;
            margin-bottom: 8px;
        }

        .countdown-label {
            font-size: 0.8rem;
            color: #9CA3AF;
            text-transform: uppercase;
        }

        .contact-section {
            text-align: center;
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid #2D3748;
        }

        .contact-section p {
            color: #9CA3AF;
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(17, 24, 39, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9CA3AF;
            font-size: 1.5rem;
            transition: all 0.3s;
            border: 1px solid #2D3748;
            text-decoration: none;
        }

        .social-link:hover {
            background: #7C3AED;
            color: white;
            transform: translateY(-3px);
            border-color: #7C3AED;
        }

        .refresh-btn {
            background: none;
            border: 2px solid #2D3748;
            color: #9CA3AF;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            border-color: #7C3AED;
            color: #7C3AED;
        }

        @media (max-width: 480px) {
            .maintenance-card {
                padding: 32px 20px;
            }

            .maintenance-title {
                font-size: 2rem;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .countdown {
                gap: 10px;
            }

            .countdown-item {
                min-width: 50px;
            }

            .countdown-number {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-card">
            <div class="maintenance-icon">
                <i class="fas fa-tools"></i>
            </div>
            
            <h1 class="maintenance-title" id="maintenanceTitle">Maintenance en cours</h1>
            
            <p class="maintenance-message" id="maintenanceMessage">
                Notre site est actuellement en maintenance pour vous offrir une meilleure expérience.
            </p>

            <div class="info-grid">
                <div class="info-item">
                    <i class="fas fa-clock"></i>
                    <div class="info-label">Début</div>
                    <div class="info-value" id="startTime">-</div>
                </div>
                <div class="info-item">
                    <i class="fas fa-hourglass-half"></i>
                    <div class="info-label">Durée estimée</div>
                    <div class="info-value" id="estimatedDuration">-</div>
                </div>
            </div>

            <div class="countdown-container">
                <div class="countdown-title">Retour estimé dans</div>
                <div class="countdown" id="countdown">
                    <div class="countdown-item">
                        <div class="countdown-number" id="hours">00</div>
                        <div class="countdown-label">Heures</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="minutes">00</div>
                        <div class="countdown-label">Minutes</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="seconds">00</div>
                        <div class="countdown-label">Secondes</div>
                    </div>
                </div>
            </div>

            <div class="contact-section">
                <p>Besoin d'aide ? Contactez-nous</p>
                <div class="social-links" id="socialLinks">
                    <a href="#" class="social-link" id="discordLink" target="_blank">
                        <i class="fab fa-discord"></i>
                    </a>
                    <a href="#" class="social-link" id="whatsappLink" target="_blank">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                    <a href="#" class="social-link" id="emailLink">
                        <i class="fas fa-envelope"></i>
                    </a>
                </div>
                <button class="refresh-btn" onclick="window.location.reload()">
                    <i class="fas fa-sync-alt"></i>
                    Actualiser
                </button>
            </div>
        </div>
    </div>

    <script>
        async function loadMaintenanceInfo() {
            try {
                const response = await fetch('/api/maintenance/status');
                const data = await response.json();

                if (data.success && data.maintenance && data.maintenance.is_enabled) {
                    const m = data.maintenance;
                    
                    document.getElementById('maintenanceTitle').textContent = m.title || 'Maintenance en cours';
                    document.getElementById('maintenanceMessage').textContent = m.message || 'Notre site est actuellement en maintenance.';
                    document.getElementById('estimatedDuration').textContent = m.estimated_duration || 'Quelques heures';
                    
                    if (m.start_time) {
                        document.getElementById('startTime').textContent = new Date(m.start_time).toLocaleString('fr-FR', {
                            hour: '2-digit',
                            minute: '2-digit',
                            day: '2-digit',
                            month: '2-digit'
                        });
                    }

                    if (m.social_discord) {
                        document.getElementById('discordLink').href = m.social_discord;
                    }
                    if (m.social_whatsapp) {
                        document.getElementById('whatsappLink').href = m.social_whatsapp;
                    }
                    if (m.contact_email) {
                        document.getElementById('emailLink').href = `mailto:${m.contact_email}`;
                    }

                    if (m.expected_end_time) {
                        startCountdown(new Date(m.expected_end_time));
                    }
                } else {
                    // Si la maintenance est terminée, rediriger vers l'accueil
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Erreur chargement maintenance:', error);
            }
        }

        function startCountdown(endTime) {
            function updateCountdown() {
                const now = new Date();
                const diff = endTime - now;

                if (diff <= 0) {
                    document.getElementById('hours').textContent = '00';
                    document.getElementById('minutes').textContent = '00';
                    document.getElementById('seconds').textContent = '00';
                    
                    // Vérifier si la maintenance est terminée
                    setTimeout(() => window.location.reload(), 5000);
                    return;
                }

                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        loadMaintenanceInfo();
    </script>
</body>
</html>
