<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Maintenance - KermHosting">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237C3AED'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>K</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <title>Maintenance - KermHosting</title>
    
    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #9D6CFF;
            --primary-dark: #5B2AB0;
            --primary-glow: rgba(124, 58, 237, 0.3);
            --secondary: #10B981;
            --secondary-light: #34D399;
            --accent: #F59E0B;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            
            --bg-dark: #0B1120;
            --bg-card: #1A2332;
            --bg-sidebar: #111827;
            --bg-hover: #1F2937;
            --bg-input: #1E293B;
            
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            
            --border-color: #2D3748;
            --border-light: #374151;
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 15px var(--primary-glow);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.15) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .maintenance-container {
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .maintenance-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 48px 32px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .maintenance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
        }

        .maintenance-icon {
            font-size: 5rem;
            text-align: center;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        .maintenance-icon i {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .maintenance-title {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            text-align: center;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .maintenance-message {
            font-size: 1.2rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.6;
            padding: 0 20px;
        }

        .countdown-container {
            background: var(--bg-hover);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
        }

        .countdown-title {
            font-size: 1rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .countdown-item {
            text-align: center;
            min-width: 80px;
        }

        .countdown-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 4px;
        }

        .countdown-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .contact-item {
            background: var(--bg-hover);
            border-radius: var(--radius-lg);
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text-primary);
        }

        .contact-item:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }

        .contact-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .contact-icon.whatsapp {
            color: #25D366;
        }

        .contact-icon.email {
            color: var(--primary);
        }

        .contact-icon.discord {
            color: #5865F2;
        }

        .contact-label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .contact-value {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .status-message {
            text-align: center;
            margin: 20px 0;
            padding: 10px;
            border-radius: var(--radius-md);
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .status-message i {
            color: var(--primary);
            margin-right: 8px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .refresh-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
        }

        .refresh-btn:hover {
            border-color: var(--primary);
            background: var(--bg-hover);
        }

        .refresh-btn i {
            transition: transform 0.3s;
        }

        .refresh-btn:hover i {
            transform: rotate(180deg);
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .floating-shape {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.1;
            z-index: 0;
        }

        .shape-1 {
            top: -200px;
            left: -200px;
            background: var(--primary);
        }

        .shape-2 {
            bottom: -200px;
            right: -200px;
            background: var(--accent);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .maintenance-card {
                padding: 32px 20px;
            }

            .maintenance-title {
                font-size: 2rem;
            }

            .maintenance-message {
                font-size: 1rem;
            }

            .countdown {
                gap: 10px;
            }

            .countdown-item {
                min-width: 60px;
            }

            .countdown-value {
                font-size: 1.8rem;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Formes décoratives -->
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>

    <div class="maintenance-container">
        <div class="maintenance-card">
            <div class="maintenance-icon">
                <i class="fas fa-tools"></i>
            </div>
            
            <h1 class="maintenance-title" id="maintenanceTitle">Maintenance en cours</h1>
            
            <div class="maintenance-message" id="maintenanceMessage">
                Chargement du message de maintenance...
            </div>

            <!-- Statut de vérification -->
            <div class="status-message" id="statusMessage">
                <i class="fas fa-sync-alt fa-spin"></i>
                <span>Vérification de l'état du serveur...</span>
            </div>

            <!-- Compte à rebours -->
            <div class="countdown-container" id="countdownContainer" style="display: none;">
                <div class="countdown-title">Retour estimé</div>
                <div class="countdown" id="countdown">
                    <div class="countdown-item">
                        <div class="countdown-value" id="days">00</div>
                        <div class="countdown-label">jours</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-value" id="hours">00</div>
                        <div class="countdown-label">heures</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-value" id="minutes">00</div>
                        <div class="countdown-label">minutes</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-value" id="seconds">00</div>
                        <div class="countdown-label">secondes</div>
                    </div>
                </div>
            </div>

            <!-- Contacts -->
            <div class="contact-grid" id="contactsContainer">
                <a href="#" class="contact-item" id="whatsappLink" target="_blank">
                    <div class="contact-icon whatsapp">
                        <i class="fab fa-whatsapp"></i>
                    </div>
                    <div class="contact-label">WhatsApp</div>
                    <div class="contact-value" id="whatsappValue">Chargement...</div>
                </a>
                
                <a href="#" class="contact-item" id="emailLink">
                    <div class="contact-icon email">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="contact-label">Email</div>
                    <div class="contact-value" id="emailValue">Chargement...</div>
                </a>
                
                <a href="#" class="contact-item" id="discordLink" target="_blank">
                    <div class="contact-icon discord">
                        <i class="fab fa-discord"></i>
                    </div>
                    <div class="contact-label">Discord</div>
                    <div class="contact-value" id="discordValue">Chargement...</div>
                </a>
            </div>

            <!-- Bouton d'actualisation manuelle -->
            <button class="refresh-btn" id="refreshBtn" onclick="checkMaintenanceStatus()">
                <i class="fas fa-sync-alt"></i>
                <span>Vérifier le statut</span>
            </button>

            <!-- Footer -->
            <div class="footer">
                <p>© 2024 KermHosting. Tous droits réservés.</p>
                <p><a href="/" onclick="checkMaintenanceBeforeRedirect(event)">Retour à l'accueil</a></p>
            </div>
        </div>
    </div>

    <script>
        let checkInterval = null;
        let countdownInterval = null;

        // ===== VÉRIFIER SI LA MAINTENANCE EST TERMINÉE =====
        async function checkMaintenanceStatus() {
            try {
                const response = await fetch('/api/maintenance-status');
                const data = await response.json();

                if (data.success) {
                    // Mettre à jour l'affichage
                    document.getElementById('maintenanceMessage').textContent = data.message || 'Site en maintenance. Nous revenons très bientôt !';
                    
                    document.getElementById('whatsappValue').textContent = data.support_whatsapp || '+237600000000';
                    document.getElementById('emailValue').textContent = data.support_email || 'support@kermhosting.com';
                    document.getElementById('discordValue').textContent = data.discord_link ? 'Rejoindre' : 'kermhosting';

                    if (data.support_whatsapp) {
                        document.getElementById('whatsappLink').href = `https://wa.me/${data.support_whatsapp.replace(/[^0-9]/g, '')}`;
                    }
                    if (data.support_email) {
                        document.getElementById('emailLink').href = `mailto:${data.support_email}`;
                    }
                    if (data.discord_link) {
                        document.getElementById('discordLink').href = data.discord_link;
                    }

                    // Gestion du compte à rebours
                    if (data.estimated_end_time) {
                        document.getElementById('countdownContainer').style.display = 'block';
                        startCountdown(data.estimated_end_time);
                    } else {
                        document.getElementById('countdownContainer').style.display = 'none';
                    }

                    // 👉 SI LA MAINTENANCE N'EST PLUS ACTIVE 👈
                    if (!data.is_active) {
                        console.log('✅ Maintenance terminée, redirection...');
                        document.getElementById('statusMessage').innerHTML = `
                            <i class="fas fa-check-circle" style="color: var(--success);"></i>
                            <span>Maintenance terminée ! Redirection...</span>
                        `;
                        
                        // Arrêter les intervalles
                        if (checkInterval) {
                            clearInterval(checkInterval);
                            checkInterval = null;
                        }
                        if (countdownInterval) {
                            clearInterval(countdownInterval);
                            countdownInterval = null;
                        }
                        
                        // Rediriger vers la page appropriée
                        redirectAfterMaintenance();
                    } else {
                        document.getElementById('statusMessage').innerHTML = `
                            <i class="fas fa-sync-alt fa-spin"></i>
                            <span>Maintenance en cours - Vérification automatique toutes les 30s</span>
                        `;
                    }
                }
            } catch (error) {
                console.error('Erreur vérification maintenance:', error);
                document.getElementById('statusMessage').innerHTML = `
                    <i class="fas fa-exclamation-triangle" style="color: var(--warning);"></i>
                    <span>Erreur de connexion, nouvelle tentative...</span>
                `;
            }
        }

        // ===== REDIRECTION APRÈS MAINTENANCE =====
        function redirectAfterMaintenance() {
            const token = localStorage.getItem('token');
            
            if (token) {
                // Utilisateur connecté → rediriger vers dashboard
                window.location.href = '/dashboard';
            } else {
                // Utilisateur non connecté → rediriger vers accueil
                window.location.href = '/';
            }
        }

        // ===== VÉRIFIER AVANT DE REDIRIGER VERS L'ACCUEIL =====
        async function checkBeforeRedirect(event) {
            event.preventDefault();
            
            try {
                const response = await fetch('/api/maintenance-status');
                const data = await response.json();
                
                if (data.success && !data.is_active) {
                    window.location.href = '/';
                } else {
                    // Rester sur la page de maintenance
                    alert('La maintenance est toujours en cours. Veuillez patienter.');
                }
            } catch (error) {
                window.location.href = '/';
            }
        }

        // ===== DÉMARRER LE COMPTE À REBOURS =====
        function startCountdown(endTime) {
            const endDate = new Date(endTime).getTime();

            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = endDate - now;

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('countdownContainer').style.display = 'none';
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            }, 1000);
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            // Vérification initiale
            checkMaintenanceStatus();
            
            // Vérification toutes les 30 secondes
            checkInterval = setInterval(checkMaintenanceStatus, 30000);
        });

        // Nettoyer les intervalles à la fermeture
        window.addEventListener('beforeunload', () => {
            if (checkInterval) {
                clearInterval(checkInterval);
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
        });

        // Exposer les fonctions globalement
        window.checkMaintenanceStatus = checkMaintenanceStatus;
        window.checkBeforeRedirect = checkBeforeRedirect;
    </script>
</body>
</html>
