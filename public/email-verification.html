<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Vérifiez votre adresse email KermHosting">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237C3AED'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>K</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <title>Vérification email - KermHosting</title>
    
    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #9D6CFF;
            --primary-dark: #5B2AB0;
            --primary-glow: rgba(124, 58, 237, 0.3);
            --secondary: #10B981;
            --secondary-light: #34D399;
            --accent: #F59E0B;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            
            --bg-dark: #0B1120;
            --bg-card: #1A2332;
            --bg-sidebar: #111827;
            --bg-hover: #1F2937;
            --bg-input: #1E293B;
            
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            
            --border-color: #2D3748;
            --border-light: #374151;
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 15px var(--primary-glow);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.15) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 40px 32px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 24px;
            padding: 0 20px 20px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        .auth-logo i {
            color: var(--primary);
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: var(--primary);
            font-size: 1rem;
            width: 20px;
        }

        .form-input {
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 8px;
            font-family: monospace;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }

        .form-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
            letter-spacing: normal;
            font-size: 1rem;
        }

        .auth-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: var(--radius-full);
            padding: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .auth-btn:hover::before {
            left: 100%;
        }

        .auth-btn i {
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        .auth-btn:hover i {
            transform: translateX(5px);
        }

        .resend-link {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
        }

        .resend-link button {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            font-size: 1rem;
        }

        .resend-link button:hover {
            color: var(--primary-light);
        }

        .resend-link button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-links {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }

        .auth-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s;
        }

        .auth-links a:hover {
            color: var(--primary-light);
        }

        .auth-links a:hover::after {
            width: 100%;
        }

        .auth-links p {
            margin: 12px 0;
        }

        .message {
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message i {
            font-size: 1.2rem;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .message.info {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .floating-shape {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--primary);
            filter: blur(100px);
            opacity: 0.1;
            z-index: -1;
        }

        .shape-1 {
            top: -100px;
            left: -100px;
            background: var(--primary);
        }

        .shape-2 {
            bottom: -100px;
            right: -100px;
            background: var(--secondary);
        }

        .timer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .timer span {
            color: var(--primary);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }

            .auth-logo {
                font-size: 1.75rem;
            }

            .auth-title {
                font-size: 1.75rem;
            }

            .auth-btn {
                padding: 14px;
            }

            .form-input {
                font-size: 1.2rem;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <!-- Formes décoratives -->
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- En-tête -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>KermHosting</span>
                </div>
                <h1 class="auth-title">Vérification email</h1>
                <p class="auth-subtitle">Entrez le code à 6 chiffres envoyé à votre adresse email</p>
            </div>

            <!-- Message -->
            <div id="messageContainer">
                <div class="message info" id="infoMessage">
                    <i class="fas fa-info-circle"></i>
                    <span>Un code de vérification a été envoyé à <strong id="displayEmail">votre email</strong></span>
                </div>
            </div>

            <!-- Formulaire -->
            <form class="auth-form" id="verificationForm">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-key"></i>
                        Code de vérification
                    </label>
                    <input type="text" class="form-input" id="code" 
                           placeholder="123456" required 
                           maxlength="6" pattern="[0-9]{6}"
                           inputmode="numeric">
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">
                    <span>Vérifier</span>
                    <i class="fas fa-check"></i>
                </button>
            </form>

            <div class="resend-link">
                <p>Vous n'avez pas reçu le code ?</p>
                <button id="resendBtn" onclick="resendCode()">Renvoyer le code</button>
                <div class="timer" id="timer" style="display: none;">
                    <span id="timerSeconds">60</span> secondes avant de pouvoir renvoyer
                </div>
            </div>

            <!-- Liens -->
            <div class="auth-links">
                <p>Déjà un compte vérifié ?</p>
                <a href="/login">Se connecter</a>
            </div>
        </div>
    </div>

    <script>
        // Récupérer l'email depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('displayEmail').textContent = email;
        } else {
            window.location.href = '/login';
        }

        let resendTimer = null;
        let timerInterval = null;

        document.getElementById('verificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const code = document.getElementById('code').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageContainer = document.getElementById('messageContainer');
            
            if (code.length !== 6) {
                messageContainer.innerHTML = `
                    <div class="message error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Le code doit contenir 6 chiffres</span>
                    </div>
                `;
                return;
            }
            
            // Désactiver le bouton
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Vérification en cours</span><span class="loader"></span>';
            
            try {
                const response = await fetch('/api/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageContainer.innerHTML = `
                        <div class="message success">
                            <i class="fas fa-check-circle"></i>
                            <span>Email vérifié avec succès ! Vous allez être redirigé...</span>
                        </div>
                    `;
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 2000);
                } else {
                    messageContainer.innerHTML = `
                        <div class="message error">
                            <i class="fas fa-exclamation-circle"></i>
                            <span>${data.error || 'Code incorrect'}</span>
                        </div>
                    `;
                    
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Vérifier</span><i class="fas fa-check"></i>';
                }
            } catch (error) {
                messageContainer.innerHTML = `
                    <div class="message error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Erreur de connexion au serveur</span>
                    </div>
                `;
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Vérifier</span><i class="fas fa-check"></i>';
            }
        });

        async function resendCode() {
            const resendBtn = document.getElementById('resendBtn');
            const timer = document.getElementById('timer');
            
            if (resendTimer) return;
            
            resendBtn.disabled = true;
            
            try {
                const response = await fetch('/api/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('messageContainer').innerHTML = `
                        <div class="message success">
                            <i class="fas fa-check-circle"></i>
                            <span>Un nouveau code a été envoyé !</span>
                        </div>
                    `;
                    
                    // Démarrer le timer de 30 secondes
                    let seconds = 30;
                    timer.style.display = 'block';
                    
                    timerInterval = setInterval(() => {
                        seconds--;
                        document.getElementById('timerSeconds').textContent = seconds;
                        
                        if (seconds <= 0) {
                            clearInterval(timerInterval);
                            timer.style.display = 'none';
                            resendBtn.disabled = false;
                            resendTimer = null;
                        }
                    }, 1000);
                    
                    resendTimer = setTimeout(() => {
                        resendTimer = null;
                    }, 60000);
                } else {
                    document.getElementById('messageContainer').innerHTML = `
                        <div class="message error">
                            <i class="fas fa-exclamation-circle"></i>
                            <span>${data.error || 'Erreur lors de l\'envoi'}</span>
                        </div>
                    `;
                    resendBtn.disabled = false;
                }
            } catch (error) {
                document.getElementById('messageContainer').innerHTML = `
                    <div class="message error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Erreur de connexion au serveur</span>
                    </div>
                `;
                resendBtn.disabled = false;
            }
        }

        // Nettoyer le timer si on quitte la page
        window.addEventListener('beforeunload', () => {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
        });
    </script>
</body>
</html>
