<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Réinitialisez votre mot de passe KermHosting">
    <meta property="og:image" content="https://files.catbox.moe/d66qx0.jpeg">

    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="16x16" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="32x32" href="https://files.catbox.moe/d66qx0.jpeg">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237C3AED'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>K</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <title>Réinitialisation du mot de passe - KermHosting</title>
    
    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #9D6CFF;
            --primary-dark: #5B2AB0;
            --primary-glow: rgba(124, 58, 237, 0.3);
            --secondary: #10B981;
            --secondary-light: #34D399;
            --accent: #F59E0B;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            
            --bg-dark: #0B1120;
            --bg-card: #1A2332;
            --bg-sidebar: #111827;
            --bg-hover: #1F2937;
            --bg-input: #1E293B;
            
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            
            --border-color: #2D3748;
            --border-light: #374151;
            
            --shadow-glow: 0 0 15px var(--primary-glow);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* ===== ICÔNES RESET EN BACKGROUND ===== */
        .reset-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 0;
            overflow: hidden;
        }

        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.05;
            color: var(--primary-light);
            animation: iconFloat 15s ease-in-out infinite;
        }

        .floating-icon:nth-child(1) { top: 8%; left: 5%; animation-delay: 0s; font-size: 2.8rem; }
        .floating-icon:nth-child(2) { top: 18%; right: 10%; animation-delay: -2s; font-size: 2.2rem; }
        .floating-icon:nth-child(3) { top: 55%; left: 8%; animation-delay: -4s; font-size: 3rem; }
        .floating-icon:nth-child(4) { top: 70%; right: 6%; animation-delay: -6s; font-size: 2.5rem; }
        .floating-icon:nth-child(5) { top: 30%; left: 55%; animation-delay: -8s; font-size: 2rem; }
        .floating-icon:nth-child(6) { top: 8%; right: 35%; animation-delay: -10s; font-size: 3.2rem; }
        .floating-icon:nth-child(7) { top: 80%; left: 45%; animation-delay: -12s; font-size: 2.4rem; }
        .floating-icon:nth-child(8) { top: 40%; right: 25%; animation-delay: -14s; font-size: 2.6rem; }
        .floating-icon:nth-child(9) { top: 15%; left: 75%; animation-delay: -3s; font-size: 2rem; }
        .floating-icon:nth-child(10) { top: 85%; right: 55%; animation-delay: -5s; font-size: 2.3rem; }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.03; }
            25% { transform: translateY(-30px) translateX(25px) rotate(8deg); opacity: 0.07; }
            50% { transform: translateY(-15px) translateX(-15px) rotate(-4deg); opacity: 0.04; }
            75% { transform: translateY(-40px) translateX(-25px) rotate(12deg); opacity: 0.06; }
        }

        /* Particules */
        .particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 30%; left: 70%; animation-delay: -1s; }
        .particle:nth-child(3) { top: 55%; left: 10%; animation-delay: -2s; }
        .particle:nth-child(4) { top: 70%; left: 80%; animation-delay: -3s; }
        .particle:nth-child(5) { top: 10%; left: 50%; animation-delay: -4s; }
        .particle:nth-child(6) { top: 40%; left: 40%; animation-delay: -5s; }
        .particle:nth-child(7) { top: 60%; left: 60%; animation-delay: -2.5s; }
        .particle:nth-child(8) { top: 80%; left: 30%; animation-delay: -3.5s; }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            50% { transform: translateY(-60px) translateX(20px) scale(2); opacity: 0.3; }
            80% { opacity: 0.6; }
        }

        /* Grille subtile */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 0;
            background-image: 
                linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridPulse 8s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ===== CONTAINER ===== */
        .auth-container {
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
            position: relative;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo KermHosting */
        .logo-section {
            text-align: center;
            margin-bottom: 16px;
        }

        .kerm-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-primary);
        }

        .kerm-logo i {
            font-size: 1.8rem;
            color: var(--primary);
            filter: drop-shadow(0 0 15px var(--primary-glow));
            animation: cloudBounce 3s ease-in-out infinite;
        }

        @keyframes cloudBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Carte transparente */
        .auth-card {
            background: transparent;
            border-radius: 0;
            padding: 0;
            border: none;
            backdrop-filter: none;
            box-shadow: none;
            position: relative;
            overflow: visible;
        }

        /* Header */
        .auth-header {
            text-align: left;
            margin-bottom: 12px;
        }

        .auth-header-top {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 6px;
        }

        .login-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .login-link:hover { color: var(--primary-light); }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--text-primary);
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* Formulaire */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 11px 14px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
        }

        .form-input::placeholder { color: var(--text-muted); opacity: 0.7; }
        .form-input[readonly] { opacity: 0.7; cursor: not-allowed; }

        .password-wrapper { position: relative; }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .password-strength {
            margin-top: 4px;
            height: 3px;
            background: var(--border-color);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-text {
            font-size: 0.7rem;
            margin-top: 2px;
            text-align: right;
        }

        /* Bouton */
        .auth-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-full);
            padding: 13px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Footer */
        .auth-links {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-links a:hover { color: var(--primary-light); }

        .auth-footer {
            text-align: center;
            margin-top: 16px;
        }

        .legal-notice {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .legal-notice a { color: var(--text-secondary); text-decoration: underline; }

        /* Message */
        .message {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .message i { font-size: 1rem; }
        .message.error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); }
        .message.success { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); color: var(--success); }
        .message.info { background: rgba(124, 58, 237, 0.1); border: 1px solid var(--primary); color: var(--primary); }

        .loader {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Background animé d'icônes reset -->
    <div class="reset-bg">
        <i class="fas fa-sync-alt floating-icon"></i>
        <i class="fas fa-lock floating-icon"></i>
        <i class="fas fa-shield-alt floating-icon"></i>
        <i class="fas fa-key floating-icon"></i>
        <i class="fas fa-redo floating-icon"></i>
        <i class="fas fa-unlock floating-icon"></i>
        <i class="fas fa-fingerprint floating-icon"></i>
        <i class="fas fa-check-shield floating-icon"></i>
        <i class="fas fa-user-lock floating-icon"></i>
        <i class="fas fa-envelope-open floating-icon"></i>
    </div>

    <!-- Grille -->
    <div class="grid-bg"></div>

    <!-- Particules -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Contenu -->
    <div class="auth-container">
        <!-- Logo KermHosting -->
        <div class="logo-section">
            <div class="kerm-logo">
                <i class="fas fa-cloud-upload-alt"></i>
                <span>KermHosting</span>
            </div>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-header-top">
                    <a href="/login" class="login-link">Se connecter</a>
                </div>
                <h1 class="auth-title">Nouveau mot de passe</h1>
                <p class="auth-subtitle">Entrez le code reçu par email et votre nouveau mot de passe</p>
            </div>

            <div id="messageContainer"></div>

            <form class="auth-form" id="resetPasswordForm">
                <div class="form-group">
                    <label class="form-label">Adresse email</label>
                    <input type="email" class="form-input" id="email" 
                           placeholder="exemple@email.com" required 
                           autocomplete="email" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">Code de réinitialisation</label>
                    <input type="text" class="form-input" id="code" 
                           placeholder="123456" required 
                           maxlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label">Nouveau mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="password" 
                               placeholder="••••••••" required 
                               minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="far fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirmer le mot de passe</label>
                    <input type="password" class="form-input" id="confirmPassword" 
                           placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">
                    <span>Réinitialiser</span>
                </button>
            </form>

            <div class="auth-links">
                Pas encore de compte ? <a href="/register">S'inscrire</a>
            </div>

            <div class="auth-footer">
                <div class="legal-notice">
                    En continuant, j'accepte les 
                    <a href="#">conditions</a>, la 
                    <a href="#">politique de confidentialité</a> et la 
                    <a href="#">politique relative aux cookies</a> de KermHosting.
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('email').value = email;
        } else {
            window.location.href = '/forgot-password';
        }

        function togglePassword() {
            const password = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            if (password.length === 0) { strengthBar.style.width = '0'; strengthText.textContent = ''; return; }
            let strength = 0, color = '#EF4444', message = 'Très faible';
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            switch(strength) {
                case 0: case 1: strength = 20; color = '#EF4444'; message = 'Très faible'; break;
                case 2: strength = 40; color = '#F59E0B'; message = 'Faible'; break;
                case 3: strength = 60; color = '#3B82F6'; message = 'Moyen'; break;
                case 4: strength = 80; color = '#10B981'; message = 'Fort'; break;
                case 5: strength = 100; color = '#10B981'; message = 'Très fort'; break;
            }
            strengthBar.style.width = strength + '%';
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = message;
            strengthText.style.color = color;
        });

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageContainer = document.getElementById('messageContainer');
            
            if (password !== confirmPassword) {
                messageContainer.innerHTML = `<div class="message error"><i class="fas fa-exclamation-circle"></i><span>Les mots de passe ne correspondent pas</span></div>`;
                return;
            }
            if (password.length < 6) {
                messageContainer.innerHTML = `<div class="message error"><i class="fas fa-exclamation-circle"></i><span>Le mot de passe doit contenir au moins 6 caractères</span></div>`;
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Traitement en cours</span><span class="loader"></span>';
            
            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, newPassword: password })
                });
                const data = await response.json();
                if (data.success) {
                    messageContainer.innerHTML = `<div class="message success"><i class="fas fa-check-circle"></i><span>Mot de passe réinitialisé avec succès ! Redirection...</span></div>`;
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    messageContainer.innerHTML = `<div class="message error"><i class="fas fa-exclamation-circle"></i><span>${data.error || 'Erreur lors de la réinitialisation'}</span></div>`;
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Réinitialiser</span>';
                }
            } catch (error) {
                messageContainer.innerHTML = `<div class="message error"><i class="fas fa-exclamation-circle"></i><span>Erreur de connexion au serveur</span></div>`;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Réinitialiser</span>';
            }
        });
    </script>
</body>
</html>
