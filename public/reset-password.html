<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Réinitialisez votre mot de passe KermHosting">
    <meta property="og:image" content="https://files.catbox.moe/d66qx0.jpeg">

    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="16x16" href="https://files.catbox.moe/d66qx0.jpeg">
    <link rel="icon" type="image/png" sizes="32x32" href="https://files.catbox.moe/d66qx0.jpeg">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237C3AED'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>K</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <title>Réinitialisation du mot de passe - KermHosting</title>
    
    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #9D6CFF;
            --primary-dark: #5B2AB0;
            --primary-glow: rgba(124, 58, 237, 0.3);
            --secondary: #10B981;
            --secondary-light: #34D399;
            --accent: #F59E0B;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            
            --bg-dark: #0B1120;
            --bg-card: #1A2332;
            --bg-sidebar: #111827;
            --bg-hover: #1F2937;
            --bg-input: #1E293B;
            
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            
            --border-color: #2D3748;
            --border-light: #374151;
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 15px var(--primary-glow);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.15) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* PAS DE CADRE */
        .auth-card {
            background: transparent;
            border-radius: 0;
            padding: 0;
            border: none;
            backdrop-filter: none;
            box-shadow: none;
            position: relative;
            overflow: visible;
        }

        .auth-card::before {
            display: none;
        }

        .auth-header {
            text-align: left;
            margin-bottom: 24px;
        }

        .auth-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auth-logo-img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
        }

        .auth-logo span {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .login-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .login-link:hover {
            color: var(--primary-light);
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s;
            width: 100%;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
            transform: translateY(-1px);
        }

        .form-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .form-input[readonly] {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .password-strength {
            margin-top: 6px;
            height: 4px;
            background: var(--border-color);
            border-radius: var(--radius-full);
            overflow: hidden;
            position: relative;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-text {
            font-size: 0.75rem;
            margin-top: 4px;
            text-align: right;
        }

        .auth-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-btn:hover {
            background: var(--primary-dark);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-links {
            text-align: center;
            margin-top: 0;
            padding-top: 0;
            border-top: none;
            color: var(--text-secondary);
        }

        .auth-links p {
            display: inline;
            margin: 0;
        }

        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-links a:hover {
            color: var(--primary-light);
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
        }

        .legal-notice {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .legal-notice a {
            color: var(--text-secondary);
            text-decoration: underline;
        }

        .message {
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message i {
            font-size: 1.1rem;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .message.info {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .floating-shape {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--primary);
            filter: blur(100px);
            opacity: 0.1;
            z-index: -1;
        }

        .shape-1 {
            top: -100px;
            left: -100px;
            background: var(--primary);
        }

        .shape-2 {
            bottom: -100px;
            right: -100px;
            background: var(--secondary);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 0;
            }
            .auth-title {
                font-size: 1.5rem;
            }
            .auth-btn {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-header-top">
                    <div class="auth-logo">
                        <img src="https://files.catbox.moe/d66qx0.jpeg" alt="KermHosting" class="auth-logo-img">
                        <span>KermHosting</span>
                    </div>
                    <a href="/login" class="login-link">Se connecter</a>
                </div>
                <h1 class="auth-title">Nouveau mot de passe</h1>
                <p class="auth-subtitle">Entrez le code reçu par email et votre nouveau mot de passe</p>
            </div>

            <div id="messageContainer"></div>

            <form class="auth-form" id="resetPasswordForm">
                <div class="form-group">
                    <label class="form-label">Adresse email</label>
                    <input type="email" class="form-input" id="email" 
                           placeholder="exemple@email.com" required 
                           autocomplete="email" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">Code de réinitialisation</label>
                    <input type="text" class="form-input" id="code" 
                           placeholder="123456" required 
                           maxlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label">Nouveau mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="password" 
                               placeholder="••••••••" required 
                               minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="far fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirmer le mot de passe</label>
                    <input type="password" class="form-input" id="confirmPassword" 
                           placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">
                    <span>Réinitialiser</span>
                </button>
            </form>

            <div class="auth-links">
                <p>Pas encore de compte ?</p>
                <a href="/register">S'inscrire</a>
            </div>

            <div class="auth-footer">
                <div class="legal-notice">
                    En continuant, j'accepte les 
                    <a href="#">conditions</a>, la 
                    <a href="#">politique de confidentialité</a> et la 
                    <a href="#">politique relative aux cookies</a> de KermHosting.
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('email').value = email;
        } else {
            window.location.href = '/forgot-password';
        }

        function togglePassword() {
            const password = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            if (password.length === 0) {
                strengthBar.style.width = '0';
                strengthText.textContent = '';
                return;
            }
            
            let strength = 0;
            let color = '#EF4444';
            let message = 'Très faible';
            
            if (password.length >= 6) strength += 1;
            if (password.length >= 8) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            
            switch(strength) {
                case 0: case 1: strength = 20; color = '#EF4444'; message = 'Très faible'; break;
                case 2: strength = 40; color = '#F59E0B'; message = 'Faible'; break;
                case 3: strength = 60; color = '#3B82F6'; message = 'Moyen'; break;
                case 4: strength = 80; color = '#10B981'; message = 'Fort'; break;
                case 5: strength = 100; color = '#10B981'; message = 'Très fort'; break;
            }
            
            strengthBar.style.width = strength + '%';
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = message;
            strengthText.style.color = color;
        });

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageContainer = document.getElementById('messageContainer');
            
            if (password !== confirmPassword) {
                messageContainer.innerHTML = `
                    <div class="message error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Les mots de passe ne correspondent pas</span>
                    </div>
                `;
                return;
            }
            
            if (password.length < 6) {
                messageContainer.innerHTML = `
                    <div class="message error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Le mot de passe doit contenir au moins 6 caractères</span>
                    </div>
                `;
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Traitement en cours</span><span class="loader"></span>';
            
            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, newPassword: password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageContainer.innerHTML = `
                        <div class="message success">
                            <i class="fas fa-check-circle"></i>
                            <span>Mot de passe réinitialisé avec succès ! Redirection...</span>
                        </div>
                    `;
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    messageContainer.innerHTML = `
                        <div class="message error">
                            <i class="fas fa-exclamation-circle"></i>
                            <span>${data.error || 'Erreur lors de la réinitialisation'}</span>
                        </div>
                    `;
                    
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Réinitialiser</span>';
                }
            } catch (error) {
                messageContainer.innerHTML = `
                    <div class="message error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Erreur de connexion au serveur</span>
                    </div>
                `;
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Réinitialiser</span>';
            }
        });
    </script>
</body>
</html>
